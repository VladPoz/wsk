<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
<section class="pricing-section">
    <div class="pricing-container">
        <div class="pricing-header">
            <h2>Pricing</h2>
            <p class="pricing-subtitle">Pricing is based on usage per second.</p>
            <p class="pricing-desc">Same price for everyone, no different tiers or hidden costs.</p>
        </div>

        <div class="pricing-cards">
            <!-- Card 1 -->
            <div class="price-card">
                <div class="card-header">
                    <h3>ChatterBlast</h3>
                    <span class="service-type">Chat API</span>
                </div>
                <div class="price-box">
                    <span class="currency">$</span>
                    <span class="amount">0.0015</span>
                    <span class="unit">/ second</span>
                </div>
                <button class="btn-primary">Get Started</button>
            </div>

            <!-- Card 2 -->
            <div class="price-card featured">
                <div class="card-header">
                    <h3>DreamWeaver</h3>
                    <span class="service-type">Image Generation API</span>
                </div>
                <div class="price-box">
                    <span class="currency">$</span>
                    <span class="amount">0.0500</span>
                    <span class="unit">/ second</span>
                </div>
                <button class="btn-primary">Get Started</button>
            </div>

            <!-- Card 3 -->
            <div class="price-card">
                <div class="card-header">
                    <h3>MindReader</h3>
                    <span class="service-type">Image Recognition API</span>
                </div>
                <div class="price-box">
                    <span class="currency">$</span>
                    <span class="amount">0.0350</span>
                    <span class="unit">/ second</span>
                </div>
                <button class="btn-primary">Get Started</button>
            </div>
        </div>
    </div>
</section>
</body>
</html>
