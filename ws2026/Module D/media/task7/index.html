<script>
    function NormalizePhoneNumber(arr) {
        // write your code here
        return arr.map(item => {
            let phone = item.replace(/\D/g,'');
            if(phone[0] === '8'){
                phone = '7' + phone.substring(1);
            }
            if(phone[0] !== '7' || phone.length !== 11){
                return null;
            }
            return '+' + phone;
        });
    }

    //example usage
    console.log(NormalizePhoneNumber(["+7 (777) 123-45-67", "87771234567", "+7-777-1234567"])); // return ["+7771234567", "+7771234567", "+7771234567"]
</script>
