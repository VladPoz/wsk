<script>
    function FormatPrice(price) {
        // write your code here
        let count = 0;
        const newArr = [];
        const arr = String(price).split('').reverse();
        arr.forEach((item) => {
            if (count === 3) {
                count = 0;
                newArr.unshift(' ');
            }
            newArr.unshift(item);
            count++;
        })
        newArr.unshift('$');
        return newArr.join('');
    }

    //example usage
    console.log(FormatPrice(1234567)); // "$1 234 567"
    console.log(FormatPrice(123456)); // "$123 456"
    console.log(FormatPrice(12345)); // "$12 345"
    console.log(FormatPrice(1234)); // "$1 234"
</script>
